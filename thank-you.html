<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>送信ありがとうございました | 赤塚学園 日本語学校</title>
  <meta name="description" content="お問い合わせ・資料請求の送信が完了しました。" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="送信ありがとうございました | 赤塚学園 日本語学校" />
  <meta property="og:description" content="送信が完了しました。担当者よりご連絡いたします。" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fef7f3;
      --card: #fffdfb;
      --text: #2f1f28;
      --muted: #5a5f73;
      --accent: #cb3e7f;
      --accent-strong: #ab2f67;
      --line: #f0d7e4;
      --ring: #f8c9de;
      --ok: #0f766e;
    }

    * {
      box-sizing: border-box;
    }

    html {
      zoom: 1.35;
    }

    @media screen and (max-width: 1600px) {
      html { zoom: 1.15; }
    }

    @media screen and (max-width: 1400px) {
      html { zoom: 0.9; }
    }

    @media screen and (max-width: 1200px) {
      html { zoom: 0.75; }
    }

    @media screen and (max-width: 1024px) {
      html { zoom: 0.6; }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Zen Kaku Gothic New", "M PLUS Rounded 1c", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 16%, #ffdbe9 0%, transparent 35%),
        radial-gradient(circle at 88% 12%, #ffe8cb 0%, transparent 30%),
        linear-gradient(180deg, #fffaf7 0%, var(--bg) 100%);
      padding: 20px;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 240px;
      height: 240px;
      border-radius: 999px;
      z-index: -1;
      filter: blur(20px);
      opacity: 0.52;
      pointer-events: none;
      animation: float 12s ease-in-out infinite;
    }

    body::before {
      left: -70px;
      bottom: 30px;
      background: #ffc7dd;
    }

    body::after {
      right: -80px;
      top: 50px;
      background: #ffdca6;
      animation-delay: 1.6s;
    }

    .card {
      width: min(680px, 100%);
      background: linear-gradient(165deg, #fffefe 0%, var(--card) 100%);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 18px 36px rgba(154, 62, 107, 0.14);
      padding: 30px;
      animation: rise 0.5s ease both;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      margin-bottom: 12px;
      border-radius: 999px;
      border: 1px solid #d9eedf;
      background: #f4fdf8;
      color: var(--ok);
      font-size: 0.86rem;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 10px;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: clamp(1.55rem, 1.2rem + 1.25vw, 2.2rem);
      color: #91235a;
      letter-spacing: 0.01em;
    }

    p {
      margin: 0 0 14px;
      line-height: 1.7;
    }

    .hint {
      color: var(--muted);
      font-size: 0.95rem;
      padding: 11px 12px;
      border-radius: 10px;
      background: #fff6fa;
      border: 1px solid #f6deea;
    }

    .actions {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      text-decoration: none;
      display: inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 700;
      border: 1px solid transparent;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #ffffff;
      box-shadow: 0 10px 20px rgba(187, 56, 114, 0.25);
    }

    .btn.secondary {
      background: #ffffff;
      color: #8f2f63;
      border-color: #e6bfd5;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 2px;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    /* Confetti Canvas */
    #confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }

    /* Success Icon Animation */
    .success-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
    }

    .success-icon svg {
      width: 100%;
      height: 100%;
    }

    .success-icon circle {
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      animation: stroke-circle 0.6s ease forwards;
    }

    .success-icon path {
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: stroke-check 0.3s ease forwards 0.5s;
    }

    @keyframes stroke-circle {
      to { stroke-dashoffset: 0; }
    }

    @keyframes stroke-check {
      to { stroke-dashoffset: 0; }
    }

    /* Gradient Text */
    .gradient-text {
      background: linear-gradient(135deg, #e8107a, #ff6b9d, #e8107a);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 3s ease infinite;
    }

    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Pulse Glow */
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 10px 20px rgba(187, 56, 114, 0.25), 0 0 0 0 rgba(232, 16, 122, 0.4); }
      50% { box-shadow: 0 10px 20px rgba(187, 56, 114, 0.25), 0 0 25px 8px rgba(232, 16, 122, 0.2); }
    }

    .pulse-glow {
      animation: pulse-glow 2s ease-in-out infinite;
    }

    /* Card enhancement */
    .card {
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .chip {
      animation: rise 0.6s ease both 0.3s;
    }

    h1 {
      animation: rise 0.6s ease both 0.4s;
    }

    p {
      animation: rise 0.6s ease both 0.5s;
    }

    .hint {
      animation: rise 0.6s ease both 0.6s;
    }

    .actions {
      animation: rise 0.6s ease both 0.7s;
    }

    @media (max-width: 680px) {
      .card {
        padding: 24px 18px;
      }

      .btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <!-- Confetti Canvas -->
  <canvas id="confetti"></canvas>
  
  <main class="card">
    <div class="success-icon">
      <svg viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="25" fill="none" stroke="#4ade80" stroke-width="2"/>
        <path fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M14 27l7 7 16-16"/>
      </svg>
    </div>
    <div class="chip">✓ 送信ステータス: 完了</div>
    <h1 class="gradient-text">送信ありがとうございました</h1>
    <p>フォームの送信が完了しました。内容を確認のうえ、担当者よりご連絡いたします。</p>
    <p class="hint">💡 返信まで少しお時間をいただく場合があります。お急ぎの場合はお電話ください: <strong>099-250-1313</strong></p>
    <div class="actions">
      <a class="btn primary pulse-glow" href="index.html">🏫 学校トップへ戻る</a>
      <a class="btn secondary" href="new.html">📄 学費と入学</a>
      <a class="btn secondary" href="futurepath.html">🎯 進路情報</a>
    </div>
  </main>

  <script>
    // Confetti Animation
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const confettiColors = ['#e8107a', '#ff6b9d', '#ffd700', '#4ade80', '#60a5fa', '#f472b6'];
    const confettiPieces = [];

    for (let i = 0; i < 150; i++) {
      confettiPieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        size: Math.random() * 8 + 4,
        color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
        speed: Math.random() * 3 + 2,
        angle: Math.random() * Math.PI * 2,
        spin: Math.random() * 0.2 - 0.1
      });
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      confettiPieces.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();

        p.y += p.speed;
        p.x += Math.sin(p.angle) * 0.5;
        p.angle += p.spin;

        if (p.y > canvas.height + 20) {
          p.y = -20;
          p.x = Math.random() * canvas.width;
        }
      });

      requestAnimationFrame(animateConfetti);
    }

    animateConfetti();

    // Stop confetti after 5 seconds
    setTimeout(() => {
      confettiPieces.length = 0;
    }, 5000);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
